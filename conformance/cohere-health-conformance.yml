note: >-
  Standards and compliance posture for Cohere Health's utilization-management
  APIs and platform. API conformance items are documented product claims (the
  APIs are partner/health-plan gated so no live conformance test was possible);
  OAuth2/OIDC items are evidenced by the live discovery document on the platform
  login host. Compliance certifications are published on the company news/blog.
standards:
  # API / interoperability standards (documented product claims)
  - id: hl7-fhir-r4
    conforms: true
    evidence: HL7 Da Vinci Burden Reduction IGs (CRD/DTR/PAS) are FHIR R4; documented on the API product page.
  - id: davinci-crd
    conforms: true
    evidence: Coverage Requirements Discovery API documented as meeting the HL7 Da Vinci CRD Implementation Guide.
  - id: davinci-dtr
    conforms: true
    evidence: Documentation Templates and Rules API documented as meeting the HL7 Da Vinci DTR Implementation Guide (FHIR Questionnaire + CQL).
  - id: davinci-pas
    conforms: true
    evidence: Prior Authorization Support API documented as meeting the HL7 Da Vinci PAS Implementation Guide.
  - id: smart-on-fhir
    conforms: true
    evidence: APIs documented as supporting SMART on FHIR applications.
  - id: x12-278
    conforms: true
    evidence: PAS wraps the X12 278 utilization-management prior-authorization exchange in a FHIR interface.
  - id: cms-0057-f
    conforms: true
    evidence: Positioned as a single-vendor solution for CMS Interoperability and Prior Authorization Final Rule (CMS-0057-F) API compliance.
  - id: us-core
    conforms: true
    evidence: Asserted via SMART on FHIR + Da Vinci IG conformance (US Core profiles underpin the Da Vinci Burden Reduction IGs); not independently verified.
  # Auth standards (evidenced by live discovery document)
  - id: oauth2
    conforms: true
    evidence: login.coherehealth.com serves OAuth 2.0 authorization-server metadata (RFC 8414).
  - id: oidc
    conforms: true
    evidence: login.coherehealth.com serves an OpenID Connect discovery document (openid-configuration).
  - id: oauth2-pkce
    conforms: true
    evidence: code_challenge_methods_supported = [S256] in the discovery document (RFC 7636).
  - id: rfc9457-problem-details
    conforms: false
    evidence: No public OpenAPI available to confirm application/problem+json error responses.
  # AI-crawler access policy (evidenced by a live provider-served document)
  - id: llms-txt
    conforms: true
    evidence: >-
      https://www.coherehealth.com/llms.txt returns HTTP 200, text/plain, 2,456 bytes —
      a provider-authored per-agent access policy. Written in robots.txt directive
      syntax rather than the markdown llms.txt convention. Saved verbatim to
      llms/cohere-health-llms.txt.
undetermined:
  # Standards whose conformance could NOT be established either way, because the
  # surface that would answer the question is gated. Recorded so a later pass does
  # not read silence as a negative.
  - id: cds-hooks
    reason: >-
      The provider-portal JS bundle references a /fhir/cds/crd route, and the CDS
      Hooks discovery endpoint /cds-services exists on the platform API host — but
      core-platform.coherehealth.com answers every anonymous request with a JSON 403
      {"message":"Not Authorized","error":403}, including the discovery endpoint the
      CDS Hooks specification expects to be public. Conformance is neither confirmed
      nor refuted.
    probed:
      - url: https://core-platform.coherehealth.com/cds-services
        status: 403
      - url: https://core-platform.coherehealth.com/fhir/cds-services
        status: 403
  - id: fhir-capabilitystatement
    reason: >-
      /fhir/metadata on the platform API host returns 403 rather than a
      CapabilityStatement, and the per-health-plan FHIR endpoints are not
      anonymously addressable, so the declared FHIR R4 conformance could not be
      verified against a served CapabilityStatement.
    probed:
      - url: https://core-platform.coherehealth.com/fhir/metadata
        status: 403
ai_governance:
  policy_url: https://www.coherehealth.com/guiding-principles-of-ai
  hub_url: https://www.coherehealth.com/ai-headquarters
  oversight_body: AI Governance Board
  principles:
    - name: Accountability
      summary: >-
        AI supports rather than replaces clinicians; 150+ clinical experts keep
        decisions grounded in evidence-based knowledge.
    - name: Transparency
      summary: >-
        The clinical basis of every approval or pend is explained to the requesting
        provider; models are continuously monitored for bias, drift and accuracy.
    - name: Privacy and security
      summary: >-
        No explicit patient identifiers (names, locations) are used for care
        recommendations; HIPAA, CMS interoperability and state prior-authorization
        requirements are asserted.
    - name: Inclusiveness and equity
      summary: >-
        Standards of care applied with fairness across all members; pended requests
        reviewed by clinical experts under AI Governance Board oversight.
  agent_access_policy:
    source: https://www.coherehealth.com/llms.txt
    artifact: llms/cohere-health-llms.txt
    differential: true
    note: >-
      Differentiated by crawler: GPTBot and ChatGPT-User are restricted to a 16-path
      allow-list, while ClaudeBot, PerplexityBot, Google-Extended and the catch-all
      receive Allow: /. All agents are denied the lead-gen and workflow paths
      (/connect, /intake, /decision, /thank-you, /electronic-letter-consent,
      /um-connects-newsletter-sign-up) and every query-parameter variant.

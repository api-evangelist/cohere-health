name: Cohere Health
kind: company
description: Cohere Health is a United States clinical-intelligence and utilization-management
  company that digitizes prior authorization for health plans. Its Unify platform applies
  clinical AI and evidence-based policy to streamline authorization intake, review, and
  decisioning, and its API suite implements the HL7 Da Vinci Burden Reduction guides —
  Coverage Requirements Discovery (CRD), Documentation Templates and Rules (DTR), and
  Prior Authorization Support (PAS) — to help payers meet the CMS Interoperability and
  Prior Authorization Final Rule (CMS-0057-F). The FHIR R4 APIs support SMART on FHIR
  applications and are sold to and embedded with health plans rather than offered through
  a self-serve public developer portal; the documented product surface is real but the
  API endpoints are partner/health-plan gated. The API-based offering is branded Cohere
  Connect™ and sits alongside the Cohere Unify platform (utilization management, payment
  integrity, appeals, care management, claims operations and quality), with in-workflow
  submission via Epic's Payer Platform. The company reports more than 15 million
  authorizations processed through the APIs and over 4,000 digitized policies.

apis:
- aid: cohere-health:cohere-health-crd-api
  name: Cohere Health Coverage Requirements Discovery (CRD) API
  description: HL7 Da Vinci Coverage Requirements Discovery (CRD) FHIR API that lets a
    provider system instantly verify whether prior authorization is required and confirm
    service coverage at the point of care. Documented as meeting Da Vinci Implementation
    Guide standards and supporting SMART on FHIR; provisioned per health plan (partner
    gated), with no self-serve public developer portal or published base URL.
  humanURL: https://www.coherehealth.com/utilization-management/api-based
  tags:
  - Coverage Requirements Discovery
  - FHIR
  - Da Vinci
  - Prior Authorization
  properties:
  - type: Documentation
    url: https://www.coherehealth.com/utilization-management/api-based
- aid: cohere-health:cohere-health-dtr-api
  name: Cohere Health Documentation Templates and Rules (DTR) API
  description: HL7 Da Vinci Documentation Templates and Rules (DTR) FHIR API that intelligently
    gathers and submits the documentation a prior authorization request requires, driven
    by digitized medical policy (FHIR Questionnaire plus CQL). Documented as meeting Da
    Vinci Implementation Guide standards and supporting SMART on FHIR; provisioned per
    health plan (partner gated), with no self-serve public developer portal or published
    base URL.
  humanURL: https://www.coherehealth.com/utilization-management/api-based
  tags:
  - Documentation Templates and Rules
  - FHIR
  - Da Vinci
  - Prior Authorization
  properties:
  - type: Documentation
    url: https://www.coherehealth.com/utilization-management/api-based
- aid: cohere-health:cohere-health-pas-api
  name: Cohere Health Prior Authorization Support (PAS) API
  description: HL7 Da Vinci Prior Authorization Support (PAS) FHIR API that submits an
    authorization request and returns the outcome, wrapping X12 278 utilization-management
    exchange in a FHIR interface for CMS-0057-F compliance. Documented as meeting Da Vinci
    Implementation Guide standards and supporting SMART on FHIR; provisioned per health
    plan (partner gated), with no self-serve public developer portal or published base URL.
  humanURL: https://www.coherehealth.com/utilization-management/api-based
  tags:
  - Prior Authorization Support
  - FHIR
  - Da Vinci
  - Prior Authorization
  properties:
  - type: Documentation
    url: https://www.coherehealth.com/utilization-management/api-based

note: >-
  The Cohere platform login host login.coherehealth.com is an Okta-backed identity
  tenant and serves real OIDC/OAuth2 discovery documents — those two 200s are the
  only genuine /.well-known/ documents Cohere Health serves, and they are what the
  WellKnown pointer rests on. The marketing host www.coherehealth.com and the apex
  coherehealth.com serve no /.well-known/ surface; the apex returns a distinctive
  "Invalid .well-known request" HTML 404 for every path. The per-health-plan
  SMART-on-FHIR / FHIR authorization servers for the CRD/DTR/PAS APIs are provisioned
  per tenant and are not anonymously discoverable, so no FHIR CapabilityStatement or
  SMART configuration was captured.
  TWO FALSE POSITIVES ARE RECORDED BELOW SO A LATER PASS DOES NOT RE-CREDIT THEM:
  (1) next.coherehealth.com is a React single-page app whose catch-all answers HTTP
  200 with the same HTML shell for EVERY path, including /.well-known/agent-card.json
  and a deliberately nonsensical control path — none of its 200s are documents;
  (2) help.coherehealth.com/.well-known/security.txt returns 200 but the document is
  INTERCOM'S, not Cohere Health's (Contact: security@intercom.com,
  Canonical: https://app.intercom.com/.well-known/security.txt) — the learning center
  is hosted on Intercom, so this is the vendor's file on a vendored host and it earns
  Cohere Health no SecurityTxt credit.
